name: Create Resource Group (PowerShell external script)

on:
  workflow_dispatch:
    inputs:
      rgName:
        description: "resourceGroupName"
        required: true
      location:
        description: "location"
        required: true
        default: "westeurope"

jobs:
  create-rg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true

      - name: Install Az PowerShell module
        shell: pwsh
        run: |
          Install-Module -Name Az -Force -Scope CurrentUser

      - name: Execute external PowerShell script
        shell: pwsh
        run: |
          ./scripts/Create-RG.ps1 `
            -ResourceGroupName "${{ github.event.inputs.rgName }}" `
            -Location "${{ github.event.inputs.location }}"
